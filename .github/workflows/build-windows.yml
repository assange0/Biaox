name: Build Windows & Release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'          # 推荐：打 tag 时才发布 Release（例如 v1.0.0）
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write     # 允许创建 Release 和上传资产

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'                 # 可改成 6.12.* 或你实际使用的版本
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: |
          cmake -G Ninja -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          ctest --test-dir build --output-on-failure

      - name: Install / Deploy
        run: |
          cmake --install build --prefix "$env:GITHUB_WORKSPACE\install"

      # 如果上面的官方 deploy 脚本效果不理想，可以改用下面这行（二选一）
      # - name: Deploy with windeployqt
      #   run: |
      #     cd build/bin
      #     windeployqt --qmldir ../../qml Biaox.exe
      #     # 然后把 build/bin 复制到 install 目录

      - name: Create Zip Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF_NAME
          } else {
            "dev-" + $env:GITHUB_SHA.Substring(0,7)
          }
          
          $zipName = "Biaox-Windows-x64-$version.zip"
          
          # 打包 install 目录（推荐）
          Compress-Archive -Path install\* -DestinationPath $zipName -Force
          
          # 把 zip 名写出来，后面步骤要用
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Artifact（方便 PR 或手动下载）
        uses: actions/upload-artifact@v4
        with:
          name: Biaox-Windows-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      # ---------- 只有打了 tag 才创建 GitHub Release ----------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          name: Biaox ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
